<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab1</title>
</head>
<body>
    <header>
        <h1>Make an order</h1>
    </header>

    <hr>

    <nav>
        <h3>Navigation:</h3>
        <ul>
            <li><a href="mainPage.html">Main Page</a></li>
            <li><a href="ourCakesPage.html">Our cakes</a></li>
            <li><a href="orderPage.html">Make an Order</a></li>
            <li><a href="contactsPage.html">Contacts</a></li>
        </ul>
    </nav>

    <hr>

    <main>
        <div>
            <form>
                <h3>1. Choose your occasion</h3>
                <label>wedding</label>
                <input type="radio" name="occasion" value="wedding">
                <br>
                <label>birthday</label>
                <input type="radio" name="occasion" value="birthday">
                <br>
                <label>graduation</label>
                <input type="radio" name="occasion" value="graduation">
                <br>
                <label>party</label>
                <input type="radio" name="occasion" value="party">
                <br>
                <label>special</label>
                <input type="radio" name="occasion" value="special">
                <br>
                <label>special occasion</label>
                <input type="text" name="special_occasion">
                
                <hr>

                <h3>2. Choose your filling</h3>
                <label>cherry</label>
                <input type="radio" name="filling" value="cherry">
                <br>
                <label>orange</label>
                <input type="radio" name="filling" value="orange">
                <br>
                <label>strawberry</label>
                <input type="radio" name="filling" value="strawberry">
                <br>
                <label>blueberry</label>
                <input type="radio" name="filling" value="blueberry">
                <br>
                <label>banana</label>
                <input type="radio" name="filling" value="banana">
                <br>
                <label>chocolate</label>
                <input type="radio" name="filling" value="chocolate">
                <br>
                <label>nuts</label>
                <input type="radio" name="filling" value="nuts">
                <br>
                <label>special</label>
                <input type="radio" name="filling" value="special">
                <br>
                <label>special filling</label>
                <input type="text" name="special_filling">
                
                <hr>

                <h3>3. Leave your phone number</h3>
                <label for="phone">Phone number:</label>
                <input id="phone" name="phone" type="tel" pattern="0[0-9]{2}[0-9]{3}[0-9]{2}[0-9]{2}" placeholder="0123456789">
                <div>
                    <input type="reset">
                    <input type="submit">
                </div>
            </form>
        </div>
    </main>
</body>
</html>
